<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1.0,
               maximum-scale=1.0,
               user-scalable=no,
               viewport-fit=cover">

<title>Desafío Isuzu</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800;900&display=swap" rel="stylesheet">

<style>

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    -webkit-tap-highlight-color: transparent;
}

html,
body {
    width: 100%;
    height: 100%;
    overflow: hidden;
}

body {
    width: 100vw;
    height: 100dvh;
    min-height: 100dvh;

    font-family: 'Montserrat', sans-serif;

    background: #000;

    overflow: hidden;

    touch-action: manipulation;
}

/* =========================================================
   CONTENEDOR PRINCIPAL
   ========================================================= */

.totem {

    position: relative;

    width: 100%;
    height: 100%;

    overflow: hidden;

    background-image: url('fondo.png');
    background-position: center;
    background-size: cover;
    background-repeat: no-repeat;
}

/* =========================================================
   CONTENEDOR GENERAL
   ========================================================= */

.container {

    position: relative;

    width: 100%;
    height: 100%;

    display: grid;

    grid-template-rows: 23% 1fr 14%;

    overflow: hidden;
}

/* =========================================================
   HEADER
   ========================================================= */

.header {

    display: flex;

    align-items: center;
    justify-content: center;

    padding: 2vh 4vw;

    min-height: 0;
}

.header img {

    display: block;

    width: auto;
    height: auto;

    max-width: 85%;
    max-height: 90%;

    object-fit: contain;
}

/* =========================================================
   ÁREA CENTRAL
   ========================================================= */

.center-area {

    min-width: 0;
    min-height: 0;

    display: grid;

    grid-template-rows: auto 1fr auto;

    align-items: center;
    justify-items: center;

    padding: 1vh 3vw;

    overflow: hidden;
}

/* =========================================================
   TEXTO SUPERIOR
   ========================================================= */

.prompt-area {

    width: 100%;

    display: flex;

    align-items: center;
    justify-content: center;

    text-align: center;

    padding: 0.5vh 1vw;
}

.prompt {

    color: white;

    font-size: clamp(16px, 2.2vw, 34px);

    font-weight: 800;

    letter-spacing: 0.04em;

    text-align: center;

    line-height: 1.1;

    text-shadow:
        0 2px 4px rgba(0,0,0,0.6),
        0 0 12px rgba(0,0,0,0.4);
}

/* =========================================================
   CONTADOR
   ========================================================= */

.contador {

    position: absolute;

    left: 50%;
    top: 50%;

    transform: translate(-50%, -50%);

    z-index: 20;

    color: white;

    font-size: clamp(70px, 13vw, 180px);

    font-weight: 900;

    line-height: 1;

    text-shadow:
        0 5px 15px rgba(0,0,0,0.7),
        0 0 25px rgba(255,255,255,0.3);

    pointer-events: none;
}

/* =========================================================
   JUEGO
   ========================================================= */

.game-section {

    width: 100%;
    height: 100%;

    min-width: 0;
    min-height: 0;

    display: flex;

    align-items: center;
    justify-content: center;

    overflow: hidden;
}

.game {

    width: min(88%, 650px);

    max-height: 100%;

    display: grid;

    grid-template-columns: repeat(4, 1fr);

    gap: clamp(6px, 1vw, 18px);

    margin: auto;
}

/* =========================================================
   CARTAS
   ========================================================= */

.card {

    position: relative;

    width: 100%;

    aspect-ratio: 3 / 4;

    perspective: 1000px;

    cursor: pointer;

    user-select: none;

    -webkit-user-select: none;

    touch-action: manipulation;
}

.card-inner {

    position: absolute;

    inset: 0;

    width: 100%;
    height: 100%;

    transition: transform 0.55s;

    transform-style: preserve-3d;
}

.card.flipped .card-inner {

    transform: rotateY(180deg);
}

.card-front,
.card-back {

    position: absolute;

    inset: 0;

    width: 100%;
    height: 100%;

    border-radius: clamp(8px, 1vw, 18px);

    overflow: hidden;

    backface-visibility: hidden;

    -webkit-backface-visibility: hidden;

    display: flex;

    align-items: center;
    justify-content: center;

    box-shadow:
        0 5px 15px rgba(0,0,0,0.35);
}

.card-front {

    background: rgba(255,255,255,0.95);

    transform: rotateY(180deg);

    padding: 8%;
}

.card-front img {

    width: 100%;
    height: 100%;

    object-fit: contain;
}

.card-back {

    background-image: url('logo-isuzu.png');

    background-position: center;

    background-size: contain;

    background-repeat: no-repeat;

    background-color: #ffffff;
}

/* =========================================================
   CARTA GANADORA
   ========================================================= */

.card.ganadora .card-front {

    box-shadow:
        0 0 0 4px #ffffff,
        0 0 25px rgba(255,255,255,0.9);

    animation: ganador 0.8s ease-in-out infinite alternate;
}

@keyframes ganador {

    from {
        transform: rotateY(180deg) scale(1);
    }

    to {
        transform: rotateY(180deg) scale(1.04);
    }
}

/* =========================================================
   CONTROLES
   ========================================================= */

.controls {

    width: 100%;

    display: flex;

    align-items: center;
    justify-content: center;

    padding: 1vh 0;

    z-index: 10;
}

#btnIniciar {

    border: none;

    background: #d71920;

    color: white;

    font-family: 'Montserrat', sans-serif;

    font-size: clamp(15px, 2vw, 28px);

    font-weight: 900;

    letter-spacing: 0.04em;

    padding:
        clamp(10px, 1.3vh, 18px)
        clamp(30px, 5vw, 80px);

    border-radius: 50px;

    cursor: pointer;

    box-shadow:
        0 5px 15px rgba(0,0,0,0.35);

    transition:
        transform 0.15s,
        filter 0.15s;
}

#btnIniciar:active {

    transform: scale(0.95);

    filter: brightness(0.9);
}

#btnIniciar:disabled {

    opacity: 0.6;

    cursor: default;
}

/* =========================================================
   FOOTER
   ========================================================= */

.footer {

    display: flex;

    align-items: center;
    justify-content: center;

    padding: 1vh 4vw;

    min-height: 0;
}

.footer img {

    display: block;

    max-width: 75%;
    max-height: 80%;

    width: auto;
    height: auto;

    object-fit: contain;
}

/* =========================================================
   BOTÓN MÚSICA
   ========================================================= */

#btnMusica {

    position: absolute;

    top: max(15px, env(safe-area-inset-top));

    right: max(15px, env(safe-area-inset-right));

    z-index: 100;

    width: clamp(38px, 4vw, 60px);

    height: clamp(38px, 4vw, 60px);

    border: none;

    border-radius: 50%;

    background: rgba(0,0,0,0.55);

    color: white;

    font-size: clamp(18px, 2vw, 28px);

    cursor: pointer;

    display: flex;

    align-items: center;
    justify-content: center;

    backdrop-filter: blur(5px);

    -webkit-backdrop-filter: blur(5px);
}

/* =========================================================
   OVERLAY RESULTADO
   ========================================================= */

.overlay {

    position: absolute;

    inset: 0;

    z-index: 200;

    display: none;

    align-items: center;
    justify-content: center;

    padding: 5vw;

    background: rgba(0,0,0,0.75);

    backdrop-filter: blur(6px);

    -webkit-backdrop-filter: blur(6px);
}

.overlay.show {

    display: flex;
}

.popup {

    width: min(90%, 600px);

    max-height: 90%;

    overflow: auto;

    background: white;

    border-radius: clamp(15px, 2vw, 30px);

    padding: clamp(25px, 4vw, 50px);

    text-align: center;

    box-shadow:
        0 15px 50px rgba(0,0,0,0.5);
}

.popup h2 {

    font-size: clamp(25px, 4vw, 50px);

    font-weight: 900;

    color: #d71920;

    margin-bottom: 15px;
}

.popup p {

    font-size: clamp(15px, 2vw, 25px);

    font-weight: 600;

    color: #222;

    line-height: 1.4;

    margin-bottom: 20px;
}

.popup img {

    display: block;

    width: auto;

    height: auto;

    max-width: 80%;

    max-height: 35vh;

    object-fit: contain;

    margin: 10px auto 25px;
}

.popup button {

    border: none;

    background: #d71920;

    color: white;

    font-family: 'Montserrat', sans-serif;

    font-size: clamp(15px, 2vw, 24px);

    font-weight: 800;

    padding: 12px 35px;

    border-radius: 30px;

    cursor: pointer;
}

/* =========================================================
   TABLET / PANTALLAS PEQUEÑAS
   ========================================================= */

@media (max-width: 600px) and (orientation: portrait) {

    .container {

        grid-template-rows: 20% 1fr 12%;
    }

    .header {

        padding: 1vh 5vw;
    }

    .header img {

        max-width: 90%;
        max-height: 90%;
    }

    .center-area {

        padding:
            1vh
            4vw;
    }

    .game {

        width: min(94%, 500px);

        gap: 6px;
    }

    .footer img {

        max-width: 65%;
    }
}

/* =========================================================
   MODO VERTICAL
   ========================================================= */

@media (orientation: portrait) {

    .container {

        grid-template-rows: 23% 1fr 14%;
    }

    .center-area {

        grid-template-rows: auto 1fr auto;
    }

    .game {

        width: min(88%, 650px);
    }
}

/* =========================================================
   MODO HORIZONTAL
   =========================================================

   AQUÍ ESTÁ EL CAMBIO IMPORTANTE.

   Ya NO se intenta meter el diseño vertical
   dentro de una pantalla horizontal.

   La distribución cambia completamente:
   izquierda = título + logo
   derecha  = juego
   ========================================================= */

@media (orientation: landscape) {

    .container {

        width: 100%;
        height: 100%;

        display: grid;

        grid-template-columns: 34% 66%;

        grid-template-rows: 1fr;

        grid-template-areas:
            "left right";
    }

    /* -----------------------------------------------------
       LADO IZQUIERDO
       ----------------------------------------------------- */

    .header {

        grid-area: left;

        width: 100%;
        height: 100%;

        display: flex;

        flex-direction: column;

        align-items: center;
        justify-content: center;

        padding:
            5vh
            4vw;
    }

    .header img {

        width: 100%;

        max-width: 90%;

        max-height: 45%;

        object-fit: contain;
    }

    /* Logo inferior en horizontal */

    .footer {

        position: absolute;

        left: 0;
        bottom: 0;

        width: 34%;

        height: 18%;

        z-index: 5;

        padding: 1vh 3vw;
    }

    .footer img {

        max-width: 65%;

        max-height: 80%;
    }

    /* -----------------------------------------------------
       LADO DERECHO
       ----------------------------------------------------- */

    .center-area {

        grid-area: right;

        width: 100%;
        height: 100%;

        min-width: 0;
        min-height: 0;

        display: grid;

        grid-template-rows: auto 1fr auto;

        align-items: center;

        justify-items: center;

        padding:
            4vh
            4vw
            4vh
            1vw;

        overflow: hidden;
    }

    .prompt-area {

        width: 100%;

        padding: 0;

        min-height: 0;
    }

    .prompt {

        font-size: clamp(18px, 2.5vw, 34px);

        line-height: 1.1;
    }

    .game-section {

        width: 100%;
        height: 100%;

        min-height: 0;

        display: flex;

        align-items: center;
        justify-content: center;

        overflow: hidden;
    }

    /*
       El tamaño del tablero depende principalmente
       de la altura disponible.

       Así evitamos que las cartas se salgan
       de la pantalla en monitores panorámicos.
    */

    .game {

        width: min(
            88%,
            65vh,
            700px
        );

        max-width: 700px;

        gap: clamp(6px, 0.8vw, 16px);
    }

    .controls {

        width: 100%;

        padding: 1vh 0 0;
    }

    #btnIniciar {

        font-size: clamp(15px, 1.8vw, 25px);

        padding:
            clamp(9px, 1.2vh, 16px)
            clamp(30px, 4vw, 60px);
    }
}

/* =========================================================
   HORIZONTAL MUY ANCHO
   ========================================================= */

@media (orientation: landscape) and (min-aspect-ratio: 2/1) {

    .container {

        grid-template-columns: 30% 70%;
    }

    .footer {

        width: 30%;
    }

    .center-area {

        padding-left: 2vw;
        padding-right: 5vw;
    }

    .game {

        width: min(
            80%,
            62vh,
            700px
        );
    }
}

/* =========================================================
   HORIZONTAL CON POCA ALTURA
   ========================================================= */

@media (orientation: landscape) and (max-height: 600px) {

    .header {

        padding:
            3vh
            3vw;
    }

    .header img {

        max-height: 42%;
    }

    .center-area {

        padding:
            2vh
            3vw;
    }

    .prompt {

        font-size: clamp(14px, 2.2vw, 24px);
    }

    .game {

        width: min(
            75%,
            58vh,
            500px
        );

        gap: 5px;
    }

    #btnIniciar {

        padding:
            7px 30px;
    }

    .footer {

        height: 15%;
    }
}

/* =========================================================
   PANTALLAS MUY GRANDES
   ========================================================= */

@media (min-width: 1600px) and (orientation: landscape) {

    .game {

        max-width: 750px;
    }
}

</style>
</head>

<body>

<div class="totem">

    <div class="container">

        <!-- =================================================
             HEADER
             ================================================= -->

        <header class="header">

            <img
                src="titulo-isuzu.png"
                alt="Desafío Isuzu"
            >

        </header>


        <!-- =================================================
             ÁREA CENTRAL
             ================================================= -->

        <main class="center-area">

            <div class="prompt-area">

                <div class="prompt">
                    PON A PRUEBA TU MEMORIA
                </div>

            </div>


            <div class="game-section">

                <div
                    id="contador"
                    class="contador"
                ></div>

                <div
                    id="game"
                    class="game"
                ></div>

            </div>


            <div class="controls">

                <button
                    id="btnIniciar"
                    type="button"
                >
                    INICIAR
                </button>

            </div>

        </main>


        <!-- =================================================
             FOOTER
             ================================================= -->

        <footer class="footer">

            <img
                src="logo-autoniza.png"
                alt="Autoniza"
            >

        </footer>

    </div>


    <!-- =====================================================
         BOTÓN MÚSICA
         ===================================================== -->

    <button
        id="btnMusica"
        type="button"
        aria-label="Activar o desactivar música"
    >
        🔊
    </button>


    <!-- =====================================================
         OVERLAY
         ===================================================== -->

    <div
        id="overlay"
        class="overlay"
    >

        <div class="popup">

            <h2 id="mensaje"></h2>

            <p id="popupTexto"></p>

            <img
                id="popupPremio"
                src=""
                alt="Premio"
            >

            <button
                id="btnReiniciar"
                type="button"
            >
                JUGAR DE NUEVO
            </button>

        </div>

    </div>

</div>


<!-- =========================================================
     AUDIO
     ========================================================= -->

<audio
    id="flipSound"
    src="flip.mp3"
    preload="auto">
</audio>

<audio
    id="winSound"
    src="win.mp3"
    preload="auto">
</audio>

<audio
    id="loseSound"
    src="lose.mp3"
    preload="auto">
</audio>

<audio
    id="musica"
    src="musica.mp3"
    preload="auto"
    loop>
</audio>


<script>

/* =========================================================
   PREMIOS
   ========================================================= */

const premios = [

    {
        nombre: "TERMÓMETRO DIGITAL",
        imagen: "premio1.png"
    },

    {
        nombre: "LANYARD",
        imagen: "premio2.png"
    },

    {
        nombre: "POLO ISUZU",
        imagen: "premio3.png"
    },

    {
        nombre: "GORRA ISUZU",
        imagen: "premio4.png"
    }

];


/* =========================================================
   VARIABLES DEL JUEGO
   ========================================================= */

let cartas = [];

let primera = null;
let segunda = null;

let bloqueo = false;

let puedeJugar = false;

let resultadoMostrado = false;

let musicaSilenciada = false;


/* =========================================================
   ELEMENTOS
   ========================================================= */

const game = document.getElementById("game");

const contador = document.getElementById("contador");

const overlay = document.getElementById("overlay");

const mensaje = document.getElementById("mensaje");

const popupTexto = document.getElementById("popupTexto");

const popupPremio = document.getElementById("popupPremio");

const btnIniciar = document.getElementById("btnIniciar");

const btnReiniciar = document.getElementById("btnReiniciar");

const btnMusica = document.getElementById("btnMusica");

const flipSound = document.getElementById("flipSound");

const winSound = document.getElementById("winSound");

const loseSound = document.getElementById("loseSound");

const musica = document.getElementById("musica");


/* =========================================================
   MÚSICA
   ========================================================= */

function toggleMusica() {

    musicaSilenciada = !musicaSilenciada;

    musica.muted = musicaSilenciada;

    btnMusica.textContent =
        musicaSilenciada ? "🔇" : "🔊";
}


/* =========================================================
   MEZCLAR
   ========================================================= */

function mezclar(array) {

    for (
        let i = array.length - 1;
        i > 0;
        i--
    ) {

        const j =
            Math.floor(Math.random() * (i + 1));

        [
            array[i],
            array[j]
        ] =
        [
            array[j],
            array[i]
        ];
    }

}


/* =========================================================
   SONIDOS
   ========================================================= */

function reproducirSonido(audio) {

    audio.currentTime = 0;

    audio.play().catch(() => {});

}


/* =========================================================
   CREAR TABLERO
   ========================================================= */

function crearTablero() {

    game.innerHTML = "";

    cartas = [];

    primera = null;

    segunda = null;

    bloqueo = false;

    puedeJugar = false;

    resultadoMostrado = false;


    let baraja = [];

    premios.forEach((premio, index) => {

        baraja.push({
            ...premio,
            id: index
        });

        baraja.push({
            ...premio,
            id: index
        });

    });


    mezclar(baraja);


    baraja.forEach((premio, index) => {

        const card =
            document.createElement("div");

        card.className = "card";

        card.dataset.id = premio.id;

        card.dataset.index = index;


        card.innerHTML = `

            <div class="card-inner">

                <div class="card-front">

                    <img
                        src="${premio.imagen}"
                        alt="${premio.nombre}"
                    >

                </div>

                <div class="card-back"></div>

            </div>

        `;


        card.addEventListener(
            "click",
            () => clickCard(card)
        );


        game.appendChild(card);

        cartas.push(card);

    });

}


/* =========================================================
   INICIAR JUEGO
   ========================================================= */

async function iniciarJuego() {

    if (bloqueo) return;

    bloqueo = true;

    btnIniciar.disabled = true;


    musica
        .play()
        .catch(() => {});


    /* Mostrar todas las cartas */

    cartas.forEach(card => {

        card.classList.add("flipped");

    });


    await esperar(500);


    /* CUENTA REGRESIVA */

    for (let i = 3; i >= 1; i--) {

        contador.textContent = i;

        await esperar(700);

    }


    contador.textContent = "";


    /* Ocultar cartas */

    cartas.forEach(card => {

        card.classList.remove("flipped");

    });


    await esperar(500);


    bloqueo = false;

    puedeJugar = true;

}


/* =========================================================
   CLICK CARTA
   ========================================================= */

function clickCard(card) {

    if (!puedeJugar) return;

    if (bloqueo) return;

    if (card.classList.contains("flipped")) return;

    if (card.classList.contains("ganadora")) return;


    reproducirSonido(flipSound);


    card.classList.add("flipped");


    if (!primera) {

        primera = card;

        return;

    }


    segunda = card;

    comprobarResultado();

}


/* =========================================================
   COMPROBAR RESULTADO
   ========================================================= */

async function comprobarResultado() {

    bloqueo = true;


    await esperar(1000);


    if (
        primera.dataset.id ===
        segunda.dataset.id
    ) {

        primera.classList.add("ganadora");

        segunda.classList.add("ganadora");


        reproducirSonido(winSound);


        mostrarResultado(true);

    }

    else {

        primera.classList.remove("flipped");

        segunda.classList.remove("flipped");


        reproducirSonido(loseSound);

    }


    primera = null;

    segunda = null;


    if (!resultadoMostrado) {

        bloqueo = false;

    }

}


/* =========================================================
   MOSTRAR RESULTADO
   ========================================================= */

function mostrarResultado(gano) {

    resultadoMostrado = true;

    puedeJugar = false;


    if (gano) {

        mensaje.textContent = "¡FELICITACIONES!";

        popupTexto.textContent =
            "Encontraste una pareja y ganaste:";

        const premioId =
            parseInt(
                primera?.dataset.id ??
                segunda?.dataset.id
            );

        if (!isNaN(premioId)) {

            popupPremio.src =
                premios[premioId].imagen;

        }

    }

    else {

        mensaje.textContent = "¡SIGUE INTENTANDO!";

        popupTexto.textContent =
            "No encontraste la pareja.";

        popupPremio.src = "";

    }


    overlay.classList.add("show");

}


/* =========================================================
   REINICIAR
   ========================================================= */

function reiniciarJuego() {

    overlay.classList.remove("show");

    btnIniciar.disabled = false;

    crearTablero();

}


/* =========================================================
   ESPERAR
   ========================================================= */

function esperar(ms) {

    return new Promise(
        resolve => setTimeout(resolve, ms)
    );

}


/* =========================================================
   EVENTOS
   ========================================================= */

btnIniciar.addEventListener(
    "click",
    iniciarJuego
);


btnReiniciar.addEventListener(
    "click",
    reiniciarJuego
);


btnMusica.addEventListener(
    "click",
    toggleMusica
);


/* =========================================================
   EVITAR DOBLE TAP EN MÓVILES
   ========================================================= */

let ultimoTouch = 0;

document.addEventListener(
    "touchend",
    function(event) {

        const ahora = Date.now();
